[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcode"
version = "0.1.0"
description = "A small, auditable coding agent harness"
requires-python = ">=3.11"

[project.scripts]
proofcode = "proofcode.cli:main"

[tool.setuptools.packages.find]
include = ["proofcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
